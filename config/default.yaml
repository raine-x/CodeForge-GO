# CodeForge-Go 默认全局配置
# 可被同目录 local.yaml 覆盖；API Key 建议通过环境变量注入。

server:
  host: "127.0.0.1"
  # 监听端口：全局唯一来源（命令行不提供端口参数）。
  # 程序不会自动换端口 —— 若端口被占用会直接报错退出，
  # 请先 `make stop` 关闭旧实例，或修改此处端口。
  port: 8420
  auto_open: true          # 启动后自动拉起浏览器

llm:
  provider: "anthropic"    # anthropic | openai
  base_url: ""             # 留空使用官方默认地址
  api_key: ""              # 留空则回退到环境变量（CODEFORGE_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY）
  model: "claude-sonnet-4-20250514"
  max_tokens: 8192
  temperature: 0.2
  # 上游瞬时故障（429/500/502/503/504）自动指数退避重试；4xx 客户端错误不重试
  max_attempts: 5          # 含首次请求在内的总尝试次数
  retry_backoff_ms: 1500   # 首次退避间隔（毫秒），之后按 2 倍增长

agent:
  max_steps: 25            # ReAct 最大迭代步数
  # 自动上下文压缩：可用输入空间占用达到该比例时，调用当前模型把较早的历史
  # 压成详细摘要（会话里的历史原文仍完整保留，只影响送模内容）。
  # 压缩线 = (模型窗口 − 输出预留) × 该比例；输出预留 = min(llm.max_tokens, 窗口/2)。
  context_compress_ratio: 0.95
  # 仅在模型窗口未知（模型库条目未填「输入上下文」）时作为绝对阈值兜底。
  context_token_budget: 120000
  system_prompt_file: ""   # 留空使用内置中文 System Prompt
  work_dir: ""             # 留空使用当前工作目录
  # 隐藏工具（Exposure 层）：这些工具的定义不发给 LLM（模型收不到定义，
  # 通常也不会主动调用），但注册/执行/权限/审计链路不变。按真实工具名填写，
  # 如 ["web_search"]。注意：隐藏只影响可见面，禁止执行需在 Executor/Policy 加规则。
  hidden_tools: []

security:
  # 前端「权限控制」三态：readonly / ask / auto。缺省 ask（请求审批）。
  permission_mode: "ask"
  default_decision: "ask"  # allow | deny | ask
  auto_approve_readonly: true
  # 是否允许文件 / 命令工具访问工作区之外的路径。
  # false（默认）：路径解析后必须落在 agent.work_dir 之内，否则直接拒绝。
  # 只读工具是自动放行的，所以这里是防止「工作区外文件被静默读入上下文」的关键开关；
  # 确实需要操作工作区外的文件时，在 config/local.yaml 里覆盖为 true。
  allow_outside_workspace: false
  # 危险命令内置黑名单会强制 Deny；下列正则为「追加」，不会覆盖内置规则
  deny_patterns:
    - "(?i)rm\\s+-rf\\s+/\\s*$"
    - "(?i)mkfs(\\.[a-z0-9]+)?\\s"
    - "(?i)format\\s+[a-z]:"
    - "(?i)shutdown\\s+-[hr]"
    - "(?i)dd\\s+if=.*of=/dev/"
  rules:
    - tools: ["read_file", "list_dir", "search_files", "todo_write"]
      decision: "allow"
    - tools: ["write_file", "edit_file", "delete_file", "run_command", "web_fetch", "web_search"]
      decision: "ask"

# 联网工具（web_fetch / web_search）
# 默认关闭：需要时在 config/local.yaml 里把 enabled 改为 true 并配置搜索后端。
web:
  # enabled: false                 # 总开关：true 才注册 web_fetch / web_search
  # search_provider: tavily        # tavily（需 API Key）| searxng（需自建实例）
  # search_endpoint: ""            # searxng：JSON 端点 URL，如 https://searx.example.com/search
  # api_key_env: "TAVILY_API_KEY"  # tavily：API Key 的环境变量名
  # allow_private: false           # true 则放行回环/内网地址（SSRF 防护默认拦截）

data_dir: ".codeforge"
audit_log: ".codeforge/audit.jsonl"

# 「任务完成」系统通知（Windows Toast / Linux notify-send）
notify:
  enabled: true            # 写 false 完全关闭系统通知
  min_interval_ms: 3000    # 两次通知的最小间隔（毫秒），防止连续任务刷屏
  # 仅当窗口不可见（切走标签页 / 最小化）时才通知；窗口在前台可见时不打扰。
  # 通知使用固定 Tag/Group，新的会替换旧的，不会在通知中心里堆积。

# 内置插件（进程内增强能力，可开关；缺省开启，写 false 关闭）
builtin_plugins:
  skill_creator: true      # Skill Creator：让 AI 动态创建/迭代工作区技能（SKILL.md）
  multi_agent: true        # Multi-Agent：允许委派子智能体并行处理互不重叠的任务（策略见 subagents）
  plan: true               # Plan 计划模式：@plan 触发，只读探索后输出结构化项目计划书

# 子智能体（多智能体协作）策略
#
# 总开关就是上面的 builtin_plugins.multi_agent：关闭后 delegate_subagents 工具
# 不再注册，模型无从调用（设置页「子智能体」与「插件」两个入口读写同一字段）。
# 本节只负责「并发」与「能力」限制，均可在设置 → 子智能体中热调整。
subagents:
  max_concurrent: 5        # 一次委派最多同时运行几个子智能体（硬上限 5，只能调小）
  allow_write: true        # 允许 implement 子智能体写入/编辑文件；false 则子智能体一律只读
  allow_delete: true       # 允许子智能体删除文件（allow_write=false 时自动无效）
  allow_memory: true       # 允许子智能体写入用户记忆（save_memory）
